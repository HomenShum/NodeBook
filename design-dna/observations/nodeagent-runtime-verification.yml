rules:
  - id: rule-nodeagent-summary-before-trace
    statement: A runtime verification surface is easier to scan when aggregate state precedes per-case evidence and receipt metadata follows it.
    mechanismHypothesis: Users can decide whether to inspect a case before parsing identifiers and reasons.
    confidence: high
    appliesWhen: [three-or-more-cases, narrow-sidebar]
    doesNotApplyWhen: [single-case-error]
    evidence: [obs-mobbin-arcade-insights-1/f1, obs-mobbin-arcade-insights-1/f2, obs-mobbin-relevance-ai-agent-timeline-1/f2]

  - id: rule-nodeagent-low-ink-status-map
    statement: A compact node-link status map should use low-contrast idle edges and reserve saturated color for running or durable receipt states.
    mechanismHypothesis: The map communicates relationship and progress without competing with receipt text.
    confidence: medium
    appliesWhen: [fixed-small-case-set, receipt-backed-state]
    doesNotApplyWhen: [unbounded-knowledge-graph, decorative-activity]
    evidence: [obs-mobbin-fibery-workspace-map-1/f2, obs-mobbin-fibery-workspace-map-1/f3, obs-mobbin-gemini-thinking-steps-1/f2]

