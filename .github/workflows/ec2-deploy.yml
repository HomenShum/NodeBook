name: Build & Deploy

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GH_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: |
          IMAGE=ghcr.io/ideaflowco/mew
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .

      - name: Push image
        run: |
          IMAGE=ghcr.io/ideaflowco/mew
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: SSH to EC2 and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            export IMAGE_TAG=${{ github.sha }}
            cd /home/ubuntu/deployments
            echo "${{ secrets.GH_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            IMAGE_TAG=${{ github.sha }} sudo docker compose pull
            IMAGE_TAG=${{ github.sha }} sudo docker compose up -d
            echo y | sudo docker image prune --all