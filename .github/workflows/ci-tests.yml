name: CI Tests

on:
  push:
    paths:
      - "src/**"
      - "convex/**"
      - "package.json"
      - "yarn.lock"
      - "tsconfig.json"
      - ".github/workflows/ci-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "convex/**"
      - "package.json"
      - "yarn.lock"
      - "tsconfig.json"
      - ".github/workflows/ci-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Check generated component types
        run: yarn tcm:check-up-to-date-types
      - name: Lint
        run: yarn lint
      - name: Typecheck
        run: yarn typecheck
      - name: Run application scenarios
        run: yarn test --runInBand
      - name: Run Convex production scenarios
        run: yarn test:convex
